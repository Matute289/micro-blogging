name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twitter
          POSTGRES_PASSWORD: twitter
          POSTGRES_DB: twitter
        options: >-
          --health-cmd "pg_isready -U twitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(0)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: go test -tags integration -v ./test/...
        env:
          POSTGRES_URL: postgres://twitter:twitter@localhost:5432/twitter?sslmode=disable
          MONGO_URL: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
